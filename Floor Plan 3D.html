<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Floor Plan 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-height 3D viewport with a floating control bar. First-floor model of the plan, 1 plan px = 1 cm. */
:root{
  --bg:#e8e6e1; --fg:#1d2327; --muted:#5b666d; --panel:#f7f6f3; --line:#c9c6bf; --accent:#2f6f5e; --accent-fg:#ffffff;
  --scene-top:#cfe0ec; --scene-bottom:#f1efe9;
  --font-ui:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181b; --fg:#e8ecee; --muted:#9aa5ac; --panel:#1e2428; --line:#343d43; --accent:#5fb89f; --accent-fg:#0c1512;
  --scene-top:#1b232a; --scene-bottom:#2a2f33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b; --fg:#e8ecee; --muted:#9aa5ac; --panel:#1e2428; --line:#343d43; --accent:#5fb89f; --accent-fg:#0c1512;
  --scene-top:#1b232a; --scene-bottom:#2a2f33; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font-ui);overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%}
.bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.group{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;pointer-events:auto}
.group button{font:inherit;font-weight:600;font-size:13px;color:var(--fg);background:transparent;border:0;border-radius:7px;padding:8px 12px;min-height:36px;cursor:pointer}
.group button:hover{background:var(--line)}
.group button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.group button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px;pointer-events:none}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap">

<div id="stage" aria-label="3D model of the floor plan"></div>
<div class="bar">
  <div class="group" role="group" aria-label="View">
    <button data-view="angle" aria-pressed="true">Angled</button>
    <button data-view="top" aria-pressed="false">Top</button>
    <button data-view="south" aria-pressed="false">Front</button>
    <button data-view="walk" aria-pressed="false">Inside</button>
  </div>
  <div class="group" role="group" aria-label="Walls">
    <button data-walls="full" aria-pressed="false">Full walls</button>
    <button data-walls="cut" aria-pressed="true">Cutaway</button>
  </div>
  <div class="group" role="group" aria-label="Light">
    <button data-light="day" aria-pressed="true">Day</button>
    <button data-light="eve" aria-pressed="false">Evening</button>
  </div>
  <div class="group" role="group" aria-label="Ground floor">
    <button id="lowerBtn" aria-pressed="true">Ground floor</button>
  </div>
</div>
<div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const S = 0.01;                          // 1 plan px = 1 cm
const WALL_H = 2.7, BASE = -0.5, STEP_DROP = -0.45, FLOOR_Y = 3.2;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rnd = (()=>{ let s=7; return ()=> (s=(s*16807)%2147483647)/2147483647; })();   // fixed seed: same plants every load

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40,1,0.1,250);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI/2 - 0.02;

/* ---------- image-based lighting: a procedural sky with a bright sun patch ---------- */
(function(){
  const c=document.createElement('canvas'); c.width=4; c.height=256; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256); gr.addColorStop(0,'#5d8fc7'); gr.addColorStop(.45,'#bcd6ea'); gr.addColorStop(.5,'#f4efe4'); gr.addColorStop(1,'#b9b2a2');
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
  const es=new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide})));
  const sunPatch=new THREE.Mesh(new THREE.PlaneGeometry(24,16),new THREE.MeshBasicMaterial({color:new THREE.Color(7,6.2,5)}));
  sunPatch.position.set(25,32,24); sunPatch.lookAt(0,0,0); es.add(sunPatch);
  const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(es,0.03).texture; pm.dispose();
})();

/* ---------- procedural textures ---------- */
function canvasTex(w,h,draw,repX,repY,srgb=true){
  const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; if(srgb) t.encoding=THREE.sRGBEncoding;
  t.repeat.set(repX||1,repY||1); return t;
}
function grain(g,w,h,a,n){ for(let i=0;i<(n||w*h/25);i++){ g.fillStyle='rgba('+(rnd()<.5?'255,255,255':'0,0,0')+','+rnd()*a+')'; g.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2);} }
const tileDraw=(col,grout,veins)=>(g,w,h)=>{ g.fillStyle=col; g.fillRect(0,0,w,h); grain(g,w,h,.06);
  if(veins){ for(let i=0;i<6;i++){ g.strokeStyle='rgba(140,125,100,'+(.04+rnd()*.07)+')'; g.lineWidth=1+rnd()*2; g.beginPath(); let x=rnd()*w,y=0; g.moveTo(x,y); for(let k=0;k<6;k++){ x+=rnd()*50-25; y+=h/6; g.lineTo(x,y);} g.stroke(); } }
  g.strokeStyle=grout; g.lineWidth=5; g.strokeRect(0,0,w,h); };
const tileBump=(g,w,h)=>{ g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.strokeStyle='#000'; g.lineWidth=7; g.strokeRect(0,0,w,h); };
const woodDraw=(col)=>(g,w,h)=>{ g.fillStyle=col; g.fillRect(0,0,w,h);
  for(let i=0;i<5;i++){ g.fillStyle='rgba(0,0,0,'+(.02+.05*rnd())+')'; g.fillRect(0,i*h/5,w,h/5); g.fillStyle='rgba(40,20,5,.45)'; g.fillRect(0,i*h/5,w,2); }
  for(let i=0;i<340;i++){ g.strokeStyle='rgba(70,40,15,'+rnd()*.14+')'; g.beginPath(); const y=rnd()*h; g.moveTo(0,y); g.bezierCurveTo(w*.3,y+rnd()*5-2.5,w*.6,y+rnd()*5-2.5,w,y); g.stroke(); }
  for(let i=0;i<5;i++){ const x=rnd()*w*.9, y=(i+.5)*h/5; g.strokeStyle='rgba(40,20,5,.2)'; g.beginPath(); g.moveTo(x,y-h/10); g.lineTo(x,y+h/10); g.stroke(); } };
const woodBump=(g,w,h)=>{ g.fillStyle='#bbb'; g.fillRect(0,0,w,h); for(let i=0;i<5;i++){ g.fillStyle='#000'; g.fillRect(0,i*h/5,w,3);} for(let i=0;i<300;i++){ g.strokeStyle='rgba(0,0,0,'+rnd()*.25+')'; g.beginPath(); const y=rnd()*h; g.moveTo(0,y); g.lineTo(w,y+rnd()*4-2); g.stroke(); } };
const furnWood = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#a9733d'; g.fillRect(0,0,w,h); for(let i=0;i<240;i++){ g.strokeStyle='rgba(50,25,8,'+rnd()*.2+')'; g.beginPath(); const y=rnd()*h; g.moveTo(0,y); g.bezierCurveTo(w*.3,y+rnd()*6-3,w*.6,y+rnd()*6-3,w,y); g.stroke(); } },1,1);
const granite = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#34383d'; g.fillRect(0,0,w,h); for(let i=0;i<2600;i++){ g.fillStyle='rgba('+(rnd()<.5?'215,220,225':'8,8,10')+','+rnd()*.6+')'; g.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2);} },2,1);
const marble = canvasTex(256,256,tileDraw('#f3efe6','#f3efe6',true),2,2);
const plasterTex = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#f2eee6'; g.fillRect(0,0,w,h); grain(g,w,h,.05); },3,2);
const plasterBump = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#999'; g.fillRect(0,0,w,h); grain(g,w,h,.35); },3,2,false);
const rugTex = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#e3d4b8'; g.fillRect(0,0,w,h); grain(g,w,h,.12,9000); g.strokeStyle='rgba(150,120,80,.22)'; for(let i=0;i<w;i+=14){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,h); g.stroke(); } g.lineWidth=10; g.strokeStyle='rgba(140,110,70,.25)'; g.strokeRect(10,10,w-20,h-20); },3,3);
const fabricTex = (col)=>canvasTex(128,128,(g,w,h)=>{ g.fillStyle=col; g.fillRect(0,0,w,h); for(let i=0;i<w;i+=2){ g.fillStyle='rgba(0,0,0,.05)'; g.fillRect(i,0,1,h); g.fillRect(0,i,w,1); } grain(g,w,h,.07); },4,4);
const fabric=(col)=>new THREE.MeshStandardMaterial({map:fabricTex(col),roughness:.96,metalness:0});

const lampMat = new THREE.MeshStandardMaterial({color:0xf3e6cc,roughness:.8,emissive:0xffd9a0,emissiveIntensity:0});
const M = {
  wall: new THREE.MeshStandardMaterial({map:plasterTex,bumpMap:plasterBump,bumpScale:.4,roughness:.93}),
  wallTop: new THREE.MeshStandardMaterial({color:0x252b2f,roughness:.9}),
  glass: new THREE.MeshPhysicalMaterial({color:0xcfeaf6,roughness:.03,metalness:0,transparent:true,opacity:.26,side:THREE.DoubleSide,envMapIntensity:1.6}),
  glassShower: new THREE.MeshPhysicalMaterial({color:0xb4e1f0,roughness:.03,transparent:true,opacity:.3,side:THREE.DoubleSide}),
  wood: new THREE.MeshStandardMaterial({map:furnWood,roughness:.5}),
  woodDark: new THREE.MeshStandardMaterial({color:0x6a4524,roughness:.45}),
  door: new THREE.MeshStandardMaterial({color:0xc9a273,roughness:.5}),
  green: fabric('#5d7a50'), greenDark: fabric('#486040'), beige: fabric('#d9c7a8'), cream: fabric('#f2ece0'),
  linen: fabric('#f6f1e6'),
  white: new THREE.MeshStandardMaterial({color:0xf7f7f5,roughness:.25}),
  steel: new THREE.MeshStandardMaterial({color:0xc5cacf,roughness:.28,metalness:.9}),
  alu: new THREE.MeshStandardMaterial({color:0xdadde0,roughness:.35,metalness:.8}),
  black: new THREE.MeshStandardMaterial({color:0x14161a,roughness:.25,metalness:.25}),
  granite: new THREE.MeshStandardMaterial({map:granite,roughness:.22,metalness:.1}),
  marble: new THREE.MeshStandardMaterial({map:marble,roughness:.15}),
  leaf: new THREE.MeshStandardMaterial({color:0x3f7a3a,roughness:.55,side:THREE.DoubleSide}), leaf2: new THREE.MeshStandardMaterial({color:0x62a146,roughness:.55,side:THREE.DoubleSide}),
  pot: new THREE.MeshStandardMaterial({color:0xb7683c,roughness:.75}), soil: new THREE.MeshStandardMaterial({color:0x33241a,roughness:1}),
  mirror: new THREE.MeshStandardMaterial({color:0xe8f3f7,roughness:.02,metalness:1}),
  orange: new THREE.MeshStandardMaterial({color:0xe5791a,roughness:.45}),
  rugA: new THREE.MeshStandardMaterial({map:rugTex,roughness:1}),
  rugB: new THREE.MeshStandardMaterial({color:0xe4d3b4,map:fabricTex('#e4d3b4'),roughness:1}),
  screenOff: new THREE.MeshStandardMaterial({color:0x08090a,roughness:.08,metalness:.5}),
  lampShade: lampMat,
  sheer: new THREE.MeshStandardMaterial({color:0xfaf6ee,roughness:1,transparent:true,opacity:.55,side:THREE.DoubleSide}),
  slab: new THREE.MeshStandardMaterial({color:0xcfcac0,roughness:.9}),
  plaster: new THREE.MeshStandardMaterial({color:0xe9e3d6,roughness:.95}),
  plinth: new THREE.MeshStandardMaterial({color:0x8f8a80,roughness:1}),
  asphalt: new THREE.MeshStandardMaterial({color:0x3a3d40,roughness:.95}),
  kerb: new THREE.MeshStandardMaterial({color:0xb8b4ab,roughness:.9}),
  paint: new THREE.MeshStandardMaterial({color:0xf1efe8,roughness:.6}),
};
function floorMat(kind,w,h){
  const m=(col,grout,sz,rough,veins)=>{ const rx=w*S/sz, ry=h*S/sz; const mt=new THREE.MeshStandardMaterial({map:canvasTex(256,256,tileDraw(col,grout,veins),rx,ry),bumpMap:canvasTex(256,256,tileBump,rx,ry,false),bumpScale:.5,roughness:rough,envMapIntensity:.9}); return mt; };
  if(kind==='cream')   return m('#eadfca','#c9bca4',.8,.22,true);
  if(kind==='grey')    return m('#b9bcbe','#8e9195',.3,.4);
  if(kind==='blue')    return m('#9fc3d0','#7c9fab',.3,.25);
  if(kind==='outdoor') return m('#d9cfbf','#b8ad9b',.5,.85);
  if(kind==='kitchen') return m('#ece3d1','#c9bda5',.6,.22,true);
  if(kind==='wood'){ const rx=w*S/1.2, ry=h*S/1.2; return new THREE.MeshStandardMaterial({map:canvasTex(512,512,woodDraw('#c79a68'),rx,ry),bumpMap:canvasTex(512,512,woodBump,rx,ry,false),bumpScale:.35,roughness:.38,envMapIntensity:1}); }
  return new THREE.MeshStandardMaterial({color:0xdddddd});
}

/* ---------- helpers (plan coordinates in px; plan y becomes world z) ---------- */
const root = new THREE.Group(); scene.add(root); root.position.y = FLOOR_Y;
const shadowTex = canvasTex(128,128,(g,w,h)=>{ const gr=g.createRadialGradient(w/2,h/2,w*.08,w/2,h/2,w*.5); gr.addColorStop(0,'rgba(0,0,0,.75)'); gr.addColorStop(.55,'rgba(0,0,0,.35)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,w,h); },1,1);
const shadowMat = new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false,opacity:.5});
function contact(cx,cz,w,d,el){   // soft ambient-occlusion blob under furniture standing on the floor
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w*1.35+.12,d*1.35+.12),shadowMat); m.rotation.x=-Math.PI/2; m.position.set(cx,el+.009,cz); root.add(m);
}
function add(m,cast=true,recv=true){ m.castShadow=cast; m.receiveShadow=recv; root.add(m); return m; }
const onFloor = el => el===0 || el===STEP_DROP;
function B(x,y,w,h,ht,el,mat,o={}){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w*S,ht,h*S),mat);
  m.position.set((x+w/2)*S, el+ht/2, (y+h/2)*S); if(o.ry) m.rotation.y=o.ry;
  if(o.contact!==false && ht>=.3 && onFloor(el) && w*h>400) contact((x+w/2)*S,(y+h/2)*S,w*S,h*S,el);
  return add(m,o.cast!==false,o.recv!==false);
}
function C(cx,cy,r,ht,el,mat,o={}){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r*S,r*S,ht,o.seg||40),mat);
  m.position.set(cx*S, el+ht/2, cy*S); if(o.sx) m.scale.x=o.sx; if(o.sz) m.scale.z=o.sz;
  if(o.contact!==false && ht>=.3 && onFloor(el) && r>12) contact(cx*S,cy*S,r*2*S,r*2*S,el);
  return add(m);
}
function RB(x,y,w,h,ht,el,mat,r=.05,o={}){   // soft-edged box for upholstery, pillows, beds
  const bev=Math.min(.03,ht/3.2,w*S/4,h*S/4), W=w*S-2*bev*.9, H=h*S-2*bev*.9, rr=Math.max(.002,Math.min(r,W/2-.001,H/2-.001));
  const sh=new THREE.Shape(), x0=-W/2, y0=-H/2;
  sh.moveTo(x0+rr,y0); sh.lineTo(x0+W-rr,y0); sh.quadraticCurveTo(x0+W,y0,x0+W,y0+rr); sh.lineTo(x0+W,y0+H-rr); sh.quadraticCurveTo(x0+W,y0+H,x0+W-rr,y0+H);
  sh.lineTo(x0+rr,y0+H); sh.quadraticCurveTo(x0,y0+H,x0,y0+H-rr); sh.lineTo(x0,y0+rr); sh.quadraticCurveTo(x0,y0,x0+rr,y0);
  const g=new THREE.ExtrudeGeometry(sh,{depth:Math.max(ht-2*bev,.002),bevelEnabled:true,bevelThickness:bev,bevelSize:bev*.9,bevelSegments:3,curveSegments:6});
  g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,mat); m.position.set((x+w/2)*S, el+bev, (y+h/2)*S);
  if(o.contact!==false && ht>=.3 && onFloor(el) && w*h>400) contact((x+w/2)*S,(y+h/2)*S,w*S,h*S,el);
  return add(m);
}
function plant(cx,cy,el=0,k=1){
  const pot=new THREE.Mesh(new THREE.CylinderGeometry(11*k*S*1.0*1.0,8*k*S*1.0*1.0,.26*k,24),M.pot); pot.position.set(cx*S,el+.13*k,cy*S); add(pot);
  const soil=new THREE.Mesh(new THREE.CylinderGeometry(9.6*k*S,9.6*k*S,.02,20),M.soil); soil.position.set(cx*S,el+.255*k,cy*S); root.add(soil);
  const lg=new THREE.SphereGeometry(1,10,8);
  for(let i=0;i<15;i++){
    const piv=new THREE.Object3D(); piv.position.set(cx*S,el+.25*k,cy*S); piv.rotation.y=i/15*Math.PI*2+rnd()*.4;
    const tilt=new THREE.Object3D(); tilt.rotation.z=.18+rnd()*.7; piv.add(tilt);
    const len=(.2+rnd()*.17)*k, leaf=new THREE.Mesh(lg,i%2?M.leaf:M.leaf2); leaf.scale.set(.05*k,len,.012*k); leaf.position.y=len*.92; leaf.castShadow=true; tilt.add(leaf);
    root.add(piv);
  }
}
function floor(x,y,w,h,el,kind,lift=0){ return B(x,y,w,h,0.06,el-0.06+lift,floorMat(kind,w,h),{cast:false,contact:false}); }

/* ---------- floors ---------- */
floor(495,18,920,467,0,'cream');
floor(188,455,1335,505,0,'outdoor');
floor(515,485,900,70,0,'cream',0.002);
floor(668,555,130,375,0,'cream',0.002);
floor(822,555,251,313,0,'cream',0.002);
floor(325,490,320,375,0,'wood',0.003);
floor(1050,135,338,327,0,'wood',0.003);
floor(1098,555,292,313,0,'kitchen',0.003);
floor(870,130,158,215,0,'grey',0.003);
floor(944,250,84,95,0,'blue',0.006);
floor(870,345,158,117,0,'cream',0.003);
floor(150,45,345,415,STEP_DROP,'cream');
floor(1030,18,382,92,0,'outdoor',0.004);
floor(188,488,117,402,0,'outdoor',0.004);
floor(188,890,1335,70,0,'outdoor',0.004);
floor(1415,455,108,435,0,'outdoor',0.004);

/* ---------- walls (painted plaster, dark cut-line on top) and windows ---------- */
const wallMeshes=[], glassMeshes=[], headers=[], doorMeshes=[];
const WINS=[[125,130,27,255],[850,45,20,63],[975,108,50,22],[1180,108,130,27],[305,630,22,112],[695,930,75,28],[880,868,95,22],[1073,640,25,115],[1390,625,25,150]];
function wallBox(x,y,w,h,y0,y1,mat,list){
  const ht=y1-y0, g=new THREE.BoxGeometry(w*S,ht,h*S); g.translate(0,ht/2,0);
  const m=new THREE.Mesh(g,mat===M.wall?[M.wall,M.wall,M.wallTop,M.wall,M.wall,M.wall]:mat);
  m.position.set((x+w/2)*S,y0,(y+h/2)*S); m.castShadow=m.receiveShadow=true; root.add(m); list&&list.push(m); return m;
}
function cutWall(r){   // a wall with a window in it is split so the window leaves a real opening
  const [x,y,w,h]=r, vert=h>w; let pieces=[[vert?y:x, vert?y+h:x+w]];
  WINS.forEach(q=>{
    const ox=Math.min(x+w,q[0]+q[2])-Math.max(x,q[0]), oy=Math.min(y+h,q[1]+q[3])-Math.max(y,q[1]);
    if(ox<=0||oy<=0) return;
    const a=vert?q[1]:q[0], b=vert?q[1]+q[3]:q[0]+q[2], next=[];
    pieces.forEach(p=>{ if(b<=p[0]||a>=p[1]){ next.push(p); return; } if(a>p[0]) next.push([p[0],a]); if(b<p[1]) next.push([b,p[1]]); });
